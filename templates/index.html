<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8 视频切片首帧预览工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 0;
        }

        .header h1 {
            font-size: 2.2em;
            color: #00d4ff;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            color: #8892b0;
            font-size: 1.1em;
        }

        .input-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        /* ========== 标签页导航 ========== */
        .tab-nav {
            display: flex;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
            gap: 5px;
        }

        .tab-item {
            padding: 12px 24px;
            color: #8892b0;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 1.05em;
            border-radius: 8px 8px 0 0;
        }

        .tab-item:hover {
            color: #ccd6f6;
            background: rgba(255, 255, 255, 0.03);
        }

        .tab-item.active {
            color: #00d4ff;
            border-bottom-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccd6f6;
            font-weight: 500;
            font-size: 0.95em;
        }

        .input-group input[type="text"], .input-group input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: #e0e0e0;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .input-group input[type="text"]:focus, .input-group input[type="number"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .input-group textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.2);
            color: #e0e0e0;
            font-size: 0.9em;
            transition: all 0.3s ease;
            resize: vertical;
            min-height: 80px;
            font-family: 'Courier New', monospace;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.2);
        }

        .input-group textarea::placeholder {
            color: #5a6a8a;
        }

        .btn-download {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-download:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .btn-download:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-local {
            background: linear-gradient(135deg, #20bf55 0%, #01baef 100%);
        }
        .btn-local:hover:not(:disabled) {
            box-shadow: 0 10px 30px rgba(1, 186, 239, 0.3);
        }

        .btn-batch {
            flex: 1;
            padding: 14px;
            font-size: 1em;
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
        }
        .btn-batch:hover:not(:disabled) {
            box-shadow: 0 10px 30px rgba(142, 68, 173, 0.3);
        }

        .btn-small-fetch {
            padding: 4px 12px;
            font-size: 0.8em;
            border-radius: 6px;
            background: rgba(0, 212, 255, 0.15);
            border: 1px solid #00d4ff;
            color: #00d4ff;
            cursor: pointer;
            margin-left: 10px;
            transition: all 0.2s ease;
        }
        .btn-small-fetch:hover {
            background: rgba(0, 212, 255, 0.3);
        }

        .divider {
            border: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 30px 0;
        }

        .progress-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .progress-section.active {
            display: block;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #ccd6f6;
        }

        .progress-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-cancel {
            padding: 6px 16px;
            border: 1px solid #ff4757;
            border-radius: 6px;
            background: rgba(255, 71, 87, 0.15);
            color: #ff4757;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-cancel:hover {
            background: rgba(255, 71, 87, 0.3);
        }

        .btn-cancel:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #0099cc);
            border-radius: 5px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* ========== 批量下载侧边栏/列表区 ========== */
        .batch-list-section {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .batch-item {
            padding: 12px 18px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95em;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }

        .batch-item.active {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .batch-item.completed {
            border-color: #20bf55;
            background: rgba(32, 191, 85, 0.05);
        }

        .batch-status-icon {
            font-size: 1.2em;
        }


        .viewer-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none;
        }

        .viewer-section.active {
            display: block;
        }

        .viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .viewer-header h2 {
            color: #ccd6f6;
            font-size: 1.3em;
            display: inline-block;
        }

        .badge {
            font-size: 0.75em;
            padding: 4px 10px;
            border-radius: 8px;
            margin-left: 12px;
            vertical-align: middle;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .badge.completed { background: rgba(32, 191, 85, 0.15); color: #20bf55; border: 1px solid rgba(32, 191, 85, 0.4); }
        .badge.interrupted { background: rgba(255, 153, 0, 0.15); color: #ff9900; border: 1px solid rgba(255, 153, 0, 0.4); }

        .video-info {
            color: #8892b0;
            font-size: 0.9em;
            text-align: right;
            line-height: 1.5;
        }
        
        .save-path {
            color: #00d4ff; 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.85em;
            margin-top: 5px;
            user-select: all; 
        }

        /* ========== 主视频预览区（大图） ========== */
        .video-preview {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            border: 2px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            cursor: pointer;
        }

        .video-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transition: opacity 0.15s ease;
        }

        .video-preview .preview-time {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #00d4ff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .video-preview .preview-frame-info {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            color: #ccd6f6;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            backdrop-filter: blur(4px);
        }

        /* ========== 时间轴 ========== */
        .timeline-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 30px 20px 15px 20px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
            z-index: 10;
        }

        .timeline-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-size: 0.85em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
        }

        .timeline-wrapper {
            position: relative;
            height: 35px;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            overflow: hidden;
            cursor: crosshair;
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
        }

        .timeline-track {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .timeline-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.2), rgba(0, 153, 204, 0.25));
            width: 0%;
            pointer-events: none;
            transition: width 0.1s ease;
        }

        .timeline-cursor {
            position: absolute;
            top: 0;
            width: 2px;
            height: 100%;
            background: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
            pointer-events: none;
            display: none;
            z-index: 10;
        }

        .timeline-cursor::before {
            content: '';
            position: absolute;
            top: -5px;
            left: -4px;
            width: 10px;
            height: 10px;
            background: #00d4ff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        .timeline-cursor::after {
            content: attr(data-time);
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00d4ff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
            border: 1px solid rgba(0, 212, 255, 0.3);
            pointer-events: none;
        }

        .timeline-segments {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        .timeline-segment {
            height: 100%;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            position: absolute;
        }

        .timeline-segment.loaded {
            background: rgba(0, 212, 255, 0.1);
        }

        /* ========== 缩略图网格 ========== */
        .frames-section-title {
            color: #ccd6f6;
            font-size: 1em;
            margin: 20px 0 12px 0;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .frames-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 8px;
            position: relative;
            scroll-behavior: smooth; 
        }

        .frames-grid::-webkit-scrollbar,
        #batch_list_ul::-webkit-scrollbar {
            width: 6px;
        }

        .frames-grid::-webkit-scrollbar-track,
        #batch_list_ul::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .frames-grid::-webkit-scrollbar-thumb,
        #batch_list_ul::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 3px;
        }

        .frame-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .frame-item:hover {
            transform: scale(1.05);
            border-color: #00d4ff;
        }

        .frame-item.active {
            border-color: #00d4ff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }

        .frame-item img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            display: block;
        }

        .frame-time {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            padding: 6px;
            color: white;
            font-size: 0.75em;
            text-align: center;
            font-family: 'Courier New', monospace;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #5a6a8a;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.success {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
        }

        .toast.error {
            background: linear-gradient(135deg, #ff4757, #cc0033);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading-text {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>M3U8 视频切片首帧预览工具</h1>
            <p>支持 115 云盘文件直通下载与本地历史还原</p>
        </div>

        <div class="input-section" id="input_section">
            
            <!-- 标签页导航 -->
            <div class="tab-nav">
                <div class="tab-item active" id="nav_single" onclick="switchTab('single')">单个视频下载</div>
                <div class="tab-item" id="nav_batch" onclick="switchTab('batch')">115 批量下载</div>
                <div class="tab-item" id="nav_local" onclick="switchTab('local')">本地记录与断点</div>
            </div>

            <!-- 标签一：单任务下载 -->
            <div id="tab_single" class="tab-content active">
                <div class="input-group">
                    <label for="m3u8_url">单个 M3U8 视频直连地址</label>
                    <input type="text" id="m3u8_url" placeholder="https://example.com/video.m3u8">
                </div>
                <div class="input-group">
                    <label for="video_name">视频名称（可选）</label>
                    <input type="text" id="video_name" placeholder="输入视频名称，将用于创建文件夹">
                </div>
                <button class="btn-download" id="btn_download" onclick="startDownload()">
                    开始下载并提取首帧 (单任务)
                </button>
            </div>

            <!-- 标签二：115 云盘批量下载 -->
            <div id="tab_batch" class="tab-content">
                <div class="input-group">
                    <label for="batch_115_filenames" style="color: #00d4ff; font-weight: 600;">☁️ 从 115 网盘根目录的 "m3u8" 文件夹中提取</label>
                    <textarea id="batch_115_filenames" placeholder="输入待下载的视频文件名（每行一个）。为空时可直接点击下方下载全部。"></textarea>
                </div>
                <div style="display: flex; gap: 15px;">
                    <button class="btn-download btn-batch" style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);" id="btn_batch_specific" onclick="start115Batch(false)">
                        下载以上指定视频
                    </button>
                    <button class="btn-download btn-batch" id="btn_batch_all" onclick="start115Batch(true)">
                        ⬇️ 下载 "m3u8" 文件夹内【全部】视频
                    </button>
                </div>
            </div>

            <!-- 标签三：加载本地记录 -->
            <div id="tab_local" class="tab-content">
                <div class="input-group">
                    <label for="local_folder">加载本地已下载的记录（支持断点续传）</label>
                    <input type="text" id="local_folder" placeholder="输入之前生成的文件夹绝对路径，例如：C:\m3u8_viewer\static\xxx">
                </div>
                <button class="btn-download btn-local" id="btn_load_local" onclick="loadLocalFolder()">
                    直接加载本地数据文件夹
                </button>
            </div>

            <!-- 通用配置项 (全局生效，固定在底部) -->
            <div id="shared_settings">
                <div style="display: flex; align-items: center; margin: 30px 0 20px 0;">
                    <hr class="divider" style="flex: 1; margin: 0;">
                    <span style="color: #5a6a8a; padding: 0 15px; font-size: 0.9em; font-weight: 600; letter-spacing: 1px;">⚙️ 通用配置项 (全局生效)</span>
                    <hr class="divider" style="flex: 1; margin: 0;">
                </div>
                
                <div class="input-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label for="cookie" style="margin-bottom: 0;">Cookie（下载 115 视频必须项，自动保存）</label>
                        <button type="button" class="btn-small-fetch" onclick="fetch115Cookie()">⚡ 一键获取已登录的 115 Cookie</button>
                    </div>
                    <textarea id="cookie" placeholder="在此粘贴Cookie，例如：uuid=xxx; session=yyy; ...">{{ default_cookie }}</textarea>
                </div>

                <div class="input-group" style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                    <label style="display: flex; align-items: center; cursor: pointer; color: #e0e0e0; font-weight: normal; margin-bottom: 8px;">
                        <input type="checkbox" id="use_proxy" onchange="toggleProxyUI()" {% if default_use_proxy %}checked{% endif %} style="width: auto; margin-right: 8px;">
                        启用代理选项 (关闭此项可彻底忽略全局代理直连)
                    </label>
                    <input type="text" id="proxy_address" value="{{ default_proxy_address }}" placeholder="例如：127.0.0.1:1080">
                </div>

                <div class="input-group">
                    <label for="ffmpeg_path">FFmpeg 目录或文件路径（自动保存）</label>
                    <input type="text" id="ffmpeg_path" value="{{ default_ffmpeg }}" placeholder="例如：C:\ffmpeg\bin 或 C:\ffmpeg\bin\ffmpeg.exe">
                </div>

                <div class="input-group">
                    <label>提取策略</label>
                    <div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
                        <label style="display: flex; align-items: center; cursor: pointer; color: #e0e0e0; font-weight: normal; margin: 0;">
                            <input type="radio" name="strategy" value="traffic" {% if default_strategy != 'time' %}checked{% endif %} onchange="toggleStrategyUI()" style="width: auto; margin-right: 8px;">
                            流量优先（边下边试，最省流量）
                        </label>
                        <label style="display: flex; align-items: center; cursor: pointer; color: #e0e0e0; font-weight: normal; margin: 0;">
                            <input type="radio" name="strategy" value="time" {% if default_strategy == 'time' %}checked{% endif %} onchange="toggleStrategyUI()" style="width: auto; margin-right: 8px;">
                            时间优先（固定大小或无限制，提取最快）
                        </label>
                    </div>
                    <div id="time_strategy_options" style="display: none; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-top: 15px; border: 1px solid rgba(255,255,255,0.05);">
                        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <label for="time_max_size" style="color: #ccd6f6; font-size: 0.9em; margin: 0; white-space: nowrap;">截断大小 (MB):</label>
                                <input type="number" id="time_max_size" value="{{ default_time_max_size_mb }}" step="0.1" min="0.1" style="width: 100px; padding: 10px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: #e0e0e0; border-radius: 6px;">
                            </div>
                            <label style="display: flex; align-items: center; cursor: pointer; color: #e0e0e0; font-weight: normal; margin: 0; font-size: 0.9em;">
                                <input type="checkbox" id="unlimited_size" onchange="toggleUnlimited()" {% if default_is_unlimited %}checked{% endif %} style="width: auto; margin-right: 8px;">
                                无限制（完整下完每个切片）
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 批量下载特供：任务列表大纲 -->
        <div id="batch_list_section" class="batch-list-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="color: #ccd6f6; font-size: 1.1em; margin: 0;">批量待下载列表</h3>
                <span id="batch_counter" style="color: #8892b0; font-size: 0.9em;">0 / 0</span>
            </div>
            <ul id="batch_list_ul" style="list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; scroll-behavior: smooth;">
            </ul>
        </div>

        <div class="progress-section" id="progress_section">
            <div class="progress-info">
                <div class="progress-left">
                    <span id="progress_status" class="loading-text">准备中...</span>
                    <span id="progress_sizes_info" style="color: #8892b0; font-size: 0.9em; margin-left: 15px; font-family: 'Courier New', monospace;"></span>
                    <span id="progress_time_info" style="color: #20bf55; font-size: 0.9em; margin-left: 15px; font-family: 'Courier New', monospace;"></span>
                    <button class="btn-cancel" id="btn_cancel" onclick="cancelDownload()">终止当前任务</button>
                </div>
                <span id="progress_percent">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress_bar"></div>
            </div>
        </div>

        <div class="viewer-section" id="viewer_section">
            <div class="viewer-header">
                <div>
                    <h2 id="viewer_title">视频预览</h2>
                    <!-- 动态状态徽章 -->
                    <span id="video_completion_badge" class="badge" style="display: none;"></span>
                    <!-- 断点续传按钮 -->
                    <button id="btn_resume" class="btn-download" style="display:none; width:auto; padding: 4px 14px; font-size:0.8em; margin-left: 10px; text-transform:none; letter-spacing:0;" onclick="resumeDownload()">
                        从断点处接着下载
                    </button>
                </div>
                <div>
                    <div class="video-info" id="video_info"></div>
                    <div class="save-path" id="save_path_info"></div>
                </div>
            </div>

            <!-- 主视频预览区（大图） -->
            <div class="video-preview" id="video_preview">
                <img id="preview_img" src="" alt="视频预览">
                <div class="preview-time" id="preview_time">00:00:00</div>
                <div class="preview-frame-info" id="preview_frame_info">帧 1 / 1</div>

                <!-- 时间轴移入 -->
                <div class="timeline-container">
                    <div class="timeline-label">
                        <span>00:00:00</span>
                        <span id="timeline_duration">00:00:00</span>
                    </div>
                    <div class="timeline-wrapper" id="timeline_wrapper">
                        <div class="timeline-track" id="timeline_track"></div>
                        <div class="timeline-segments" id="timeline_segments"></div>
                        <div class="timeline-progress" id="timeline_progress"></div>
                        <div class="timeline-cursor" id="timeline_cursor"></div>
                    </div>
                </div>
            </div>

            <!-- 缩略图网格（底部） -->
            <div class="frames-section-title">所有首帧缩略图</div>
            <div class="frames-grid" id="frames_grid">
            </div>
        </div>

        <div class="empty-state" id="empty_state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
                <line x1="7" y1="2" x2="7" y2="22"></line>
                <line x1="17" y1="2" x2="17" y2="22"></line>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <line x1="2" y1="7" x2="7" y2="7"></line>
                <line x1="2" y1="17" x2="7" y2="17"></line>
                <line x1="17" y1="17" x2="22" y2="17"></line>
                <line x1="17" y1="7" x2="22" y2="7"></line>
            </svg>
            <p>输入m3u8链接并点击下载，或填入本地路径复原历史记录</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let currentTaskId = null;
        let currentBatchId = null;
        
        let statusInterval = null;
        let taskData = null;
        
        let currentFrameIndex = 0;
        let renderedFrameIndexes = new Set(); 
        let timelineEventAttached = false; 

        document.addEventListener('DOMContentLoaded', () => {
            toggleStrategyUI();
            toggleUnlimited();
            toggleProxyUI();

            document.getElementById('video_preview').addEventListener('click', scrollToCurrentThumbnail);
            document.getElementById('timeline_wrapper').addEventListener('click', scrollToCurrentThumbnail);

            document.addEventListener('keydown', (e) => {
                const viewer = document.getElementById('viewer_section');
                if (!viewer.classList.contains('active')) return;
                
                if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

                if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                    e.preventDefault(); 
                }

                if (!taskData || !taskData.frames || taskData.frames.length === 0) return;
                if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                    let currentIndexInArray = taskData.frames.findIndex(f => f.index === currentFrameIndex);
                    if (currentIndexInArray === -1) currentIndexInArray = 0;
                    
                    if (e.key === 'ArrowLeft' && currentIndexInArray > 0) {
                        currentIndexInArray--;
                    } else if (e.key === 'ArrowRight' && currentIndexInArray < taskData.frames.length - 1) {
                        currentIndexInArray++;
                    }
                    
                    const targetSegment = taskData.frames[currentIndexInArray];
                    updatePreview(targetSegment.index);
                    scrollToCurrentThumbnail();
                    
                    const totalDuration = taskData.total_duration;
                    const currentTime = targetSegment.time + targetSegment.duration / 2;
                    const percent = currentTime / totalDuration;
                    
                    const progress = document.getElementById('timeline_progress');
                    progress.style.width = (percent * 100) + '%';
                }
            }, { passive: false });
        });

        // 标签页切换逻辑
        function switchTab(tabId) {
            // 重置激活状态
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));

            // 激活当前标签
            document.getElementById(`nav_${tabId}`).classList.add('active');
            document.getElementById(`tab_${tabId}`).classList.add('active');
        }

        // 异步提取 115 浏览器 Cookie
        async function fetch115Cookie() {
            showToast('正在从 115 浏览器中提取 Cookie...');
            try {
                const res = await fetch('/api/get_115_cookie');
                const data = await res.json();
                if (data.success) {
                    document.getElementById('cookie').value = data.cookie;
                    showToast('已成功提取并填入 115 Cookie！');
                } else {
                    showToast(data.error, 'error');
                }
            } catch (e) {
                showToast('提取发生网络异常: ' + e.message, 'error');
            }
        }

        // 启动 115 网盘直连批量下载
        async function start115Batch(isAll) {
            const filenamesText = document.getElementById('batch_115_filenames').value.trim();
            const filenames = filenamesText.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            
            if (!isAll && filenames.length === 0) {
                showToast('按指定文件名下载时，必须在上方输入框内填入文件名！', 'error');
                return;
            }
            
            const mode = isAll ? 'all' : 'specific';
            const cookie = document.getElementById('cookie').value.trim();
            const ffmpegPath = document.getElementById('ffmpeg_path').value.trim();

            if (!cookie) {
                showToast('115云盘直传必须填写 Cookie，请点击上方“一键获取”！', 'error');
                return;
            }

            const payload = {
                mode: mode,
                filenames: filenames,
                cookie: cookie,
                ffmpeg_path: ffmpegPath,
                ...getStrategyPayload()
            };

            const btnSpec = document.getElementById('btn_batch_specific');
            const btnAll = document.getElementById('btn_batch_all');
            btnSpec.disabled = true;
            btnAll.disabled = true;
            btnAll.textContent = '读取网盘与构建队列中...';

            try {
                const res = await fetch('/api/batch_115_start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    currentBatchId = data.batch_id;
                    currentTaskId = null; 
                    
                    document.getElementById('empty_state').style.display = 'none';
                    document.getElementById('input_section').style.display = 'none'; // 批量时隐藏大面积输入框
                    document.getElementById('viewer_section').classList.remove('active');
                    document.getElementById('progress_section').classList.add('active');
                    document.getElementById('batch_list_section').style.display = 'block';
                    
                    document.getElementById('frames_grid').innerHTML = '';
                    document.getElementById('timeline_segments').innerHTML = '';
                    document.getElementById('preview_img').src = '';
                    renderedFrameIndexes.clear();
                    currentFrameIndex = 0;
                    
                    startStatusPolling();
                    showToast(data.message);
                } else {
                    showToast(data.error || '批量启动失败', 'error');
                    resetUI();
                }
            } catch (e) {
                showToast('网络错误: ' + e.message, 'error');
            } finally {
                btnSpec.disabled = false;
                btnAll.disabled = false;
                btnAll.textContent = '⬇️ 下载 "m3u8" 文件夹内【全部】视频';
            }
        }

        // 渲染批处理任务大纲列表
        function renderBatchList(taskList, activeTaskId) {
            const ul = document.getElementById('batch_list_ul');
            ul.innerHTML = '';
            
            let completedCount = 0;

            taskList.forEach(t => {
                const li = document.createElement('li');
                li.className = 'batch-item' + (t.task_id === activeTaskId ? ' active' : '') + (['completed', 'stopped'].includes(t.status) ? ' completed' : '');
                
                let icon = '⏳';
                if (t.status === 'completed' || t.status === 'stopped') {
                    icon = '✅';
                    completedCount++;
                }
                else if (t.status === 'error' || t.status === 'cancelled') icon = '❌';
                else if (t.status === 'downloading' || t.status === 'starting' || t.status === 'parsing') icon = '🔄';
                
                li.innerHTML = `
                    <span style="color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%;">${t.video_name}</span>
                    <span class="batch-status-icon">${icon}</span>
                `;
                ul.appendChild(li);
                
                if (t.task_id === activeTaskId) {
                    setTimeout(() => {
                        const scrollPos = li.offsetTop - (ul.clientHeight / 2) + (li.clientHeight / 2);
                        ul.scrollTop = scrollPos;
                    }, 0);
                }
            });
            
            document.getElementById('batch_counter').textContent = `${completedCount} / ${taskList.length}`;
        }

        function toggleProxyUI() {
            const useProxy = document.getElementById('use_proxy').checked;
            const proxyAddressInput = document.getElementById('proxy_address');
            proxyAddressInput.disabled = !useProxy;
            proxyAddressInput.style.opacity = useProxy ? '1' : '0.5';
        }

        function scrollToCurrentThumbnail() {
            if (currentFrameIndex === null || currentFrameIndex === undefined) return;
            const grid = document.getElementById('frames_grid');
            const targetItem = Array.from(grid.children).find(child => parseInt(child.dataset.index) === currentFrameIndex);
            
            if (targetItem) {
                const scrollTop = targetItem.offsetTop - (grid.clientHeight / 2) + (targetItem.clientHeight / 2);
                grid.scrollTop = scrollTop;
            }
        }

        function toggleStrategyUI() {
            const strategy = document.querySelector('input[name="strategy"]:checked').value;
            const timeOptions = document.getElementById('time_strategy_options');
            if (strategy === 'time') {
                timeOptions.style.display = 'block';
            } else {
                timeOptions.style.display = 'none';
            }
        }
        
        function toggleUnlimited() {
            const isUnlimited = document.getElementById('unlimited_size').checked;
            const sizeInput = document.getElementById('time_max_size');
            sizeInput.disabled = isUnlimited;
            if (isUnlimited) {
                sizeInput.style.opacity = '0.5';
            } else {
                sizeInput.style.opacity = '1';
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) {
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatTimeFull(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function getStrategyPayload() {
            const strategy = document.querySelector('input[name="strategy"]:checked').value;
            const isUnlimited = document.getElementById('unlimited_size').checked;
            const mbValue = parseFloat(document.getElementById('time_max_size').value) || 1.0;
            const useProxy = document.getElementById('use_proxy').checked;
            const proxyAddress = document.getElementById('proxy_address').value.trim();
            
            let timeMaxSize = 1024 * 1024;
            if (strategy === 'time') {
                if (isUnlimited) {
                    timeMaxSize = -1;
                } else {
                    timeMaxSize = Math.floor(mbValue * 1024 * 1024);
                }
            }
            return {
                strategy: strategy,
                time_max_size: timeMaxSize,
                time_max_size_mb: mbValue,
                is_unlimited: isUnlimited,
                use_proxy: useProxy,
                proxy_address: proxyAddress
            };
        }

        async function startDownload() {
            const m3u8Url = document.getElementById('m3u8_url').value.trim();
            const videoName = document.getElementById('video_name').value.trim();
            const cookie = document.getElementById('cookie').value.trim();
            const ffmpegPath = document.getElementById('ffmpeg_path').value.trim();

            if (!m3u8Url) {
                showToast('请输入m3u8视频地址', 'error');
                return;
            }

            const payload = {
                m3u8_url: m3u8Url, 
                video_name: videoName, 
                cookie: cookie, 
                ffmpeg_path: ffmpegPath,
                ...getStrategyPayload()
            };

            const btn = document.getElementById('btn_download');
            btn.disabled = true;
            btn.textContent = '处理中...';
            document.getElementById('btn_load_local').disabled = true;

            document.getElementById('empty_state').style.display = 'none';
            document.getElementById('input_section').style.display = 'none';
            document.getElementById('viewer_section').classList.remove('active');
            document.getElementById('progress_section').classList.add('active');
            document.getElementById('progress_sizes_info').textContent = '';
            document.getElementById('progress_time_info').textContent = '';
            document.getElementById('preview_img').src = '';
            
            document.getElementById('frames_grid').innerHTML = '';
            document.getElementById('timeline_segments').innerHTML = '';
            renderedFrameIndexes.clear();
            currentFrameIndex = 0;

            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.success) {
                    currentTaskId = data.task_id;
                    currentBatchId = null;
                    startStatusPolling();
                } else {
                    showToast(data.error || '启动失败', 'error');
                    resetUI();
                }
            } catch (error) {
                showToast('网络错误: ' + error.message, 'error');
                resetUI();
            }
        }

        async function resumeDownload() {
            if (!currentTaskId) return;
            
            const m3u8Url = document.getElementById('m3u8_url').value.trim();
            const cookie = document.getElementById('cookie').value.trim();
            const ffmpegPath = document.getElementById('ffmpeg_path').value.trim();

            if (!m3u8Url) {
                showToast('恢复下载需要M3U8链接，请在上方输入框补全！', 'error');
                return;
            }

            const payload = {
                m3u8_url: m3u8Url, 
                cookie: cookie, 
                ffmpeg_path: ffmpegPath,
                ...getStrategyPayload()
            };

            const btn = document.getElementById('btn_resume');
            btn.disabled = true;
            btn.textContent = '启动中...';

            try {
                const response = await fetch(`/api/resume/${currentTaskId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if (data.success) {
                    btn.style.display = 'none';
                    btn.disabled = false;
                    btn.textContent = '从断点处接着下载';
                    
                    document.getElementById('btn_download').disabled = true;
                    document.getElementById('btn_load_local').disabled = true;
                    
                    document.getElementById('progress_section').classList.add('active');
                    startStatusPolling();
                    showToast('正在继续扫描与下载...');
                } else {
                    showToast(data.error || '继续下载失败', 'error');
                    btn.disabled = false;
                    btn.textContent = '从断点处接着下载';
                }
            } catch (error) {
                showToast('网络错误: ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = '从断点处接着下载';
            }
        }

        async function loadLocalFolder() {
            const folderPath = document.getElementById('local_folder').value.trim();
            if (!folderPath) {
                showToast('请输入本地文件夹路径', 'error');
                return;
            }

            const btnLoad = document.getElementById('btn_load_local');
            btnLoad.disabled = true;
            btnLoad.textContent = '加载中...';
            document.getElementById('btn_download').disabled = true;

            document.getElementById('empty_state').style.display = 'none';
            document.getElementById('viewer_section').classList.remove('active');

            try {
                const response = await fetch('/api/load_local', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ folder_path: folderPath })
                });
                const data = await response.json();

                if (data.success) {
                    currentTaskId = data.task_id;
                    currentBatchId = null;
                    taskData = data.task_data;
                    
                    document.getElementById('video_name').value = taskData.video_name || ''; 
                    if (taskData.m3u8_url) document.getElementById('m3u8_url').value = taskData.m3u8_url;
                    if (taskData.cookie) document.getElementById('cookie').value = taskData.cookie;
                    if (taskData.ffmpeg_path) document.getElementById('ffmpeg_path').value = taskData.ffmpeg_path;
                    
                    if (taskData.use_proxy !== undefined) {
                        document.getElementById('use_proxy').checked = taskData.use_proxy;
                    }
                    if (taskData.proxy_address) {
                        document.getElementById('proxy_address').value = taskData.proxy_address;
                    }
                    toggleProxyUI();

                    if (taskData.strategy) {
                        const r = document.querySelector(`input[name="strategy"][value="${taskData.strategy}"]`);
                        if (r) r.checked = true;
                    }
                    if (taskData.time_max_size_mb !== undefined) {
                        document.getElementById('time_max_size').value = taskData.time_max_size_mb;
                    }
                    if (taskData.is_unlimited !== undefined) {
                        document.getElementById('unlimited_size').checked = taskData.is_unlimited;
                    }
                    toggleStrategyUI();
                    toggleUnlimited();

                    showToast('本地数据挂载成功！');
                    showViewer(taskData);
                } else {
                    showToast(data.error || '加载失败', 'error');
                    resetUI();
                }
            } catch (error) {
                showToast('网络错误: ' + error.message, 'error');
                resetUI();
            }
        }

        async function cancelDownload() {
            if (currentBatchId) {
                await fetch(`/api/cancel_batch/${currentBatchId}`, { method: 'POST' });
                showToast('已下达终止请求，当前视频结束后将停止队列');
            } else if (currentTaskId) {
                await fetch(`/api/cancel/${currentTaskId}`, { method: 'POST' });
                showToast('已发送终止请求');
            }
        }

        // 统一处理所有视频核心数据展示的逻辑模块
        function processTaskDataUpdate(data) {
            updateProgress(data);
            taskData = data;

            if (data.frames) {
                const newFrames = data.frames.filter(f => !renderedFrameIndexes.has(f.index));
                
                if (newFrames.length > 0) {
                    const isFirstBatch = (renderedFrameIndexes.size === 0);
                    
                    if (isFirstBatch) {
                        document.getElementById('viewer_section').classList.add('active');
                        const videoName = data.video_name || document.getElementById('video_name').value.trim() || '未命名视频';
                        document.getElementById('viewer_title').textContent = videoName;
                        document.getElementById('timeline_duration').textContent = formatTimeFull(data.total_duration);
                        if (data.work_dir) {
                            document.getElementById('save_path_info').textContent = `数据保存路径: ${data.work_dir}`;
                        }
                        initTimelineEvents();
                    }
                    
                    insertNewFrames(newFrames, data.total_duration);
                    newFrames.forEach(f => renderedFrameIndexes.add(f.index));
                    
                    updateVideoInfoText(data);
                    updateCompletionBadge(data);

                    if (isFirstBatch && data.frames.length > 0) {
                        updatePreview(data.frames[0].index);
                    }
                } else {
                    updateCompletionBadge(data);
                }
            }
        }

        function startStatusPolling() {
            if (statusInterval) clearInterval(statusInterval);

            statusInterval = setInterval(async () => {
                if (!currentTaskId && !currentBatchId) return;

                try {
                    // 1. 如果处于批量任务模式
                    if (currentBatchId) {
                        const response = await fetch(`/api/batch_status/${currentBatchId}`);
                        const data = await response.json();
                        
                        if (data.success) {
                            renderBatchList(data.task_list, data.current_task_id);
                            
                            const taskPayload = data.current_task_data;
                            if (taskPayload) {
                                // 侦测到进入了队列中的下一个视频
                                if (currentTaskId !== data.current_task_id) {
                                    currentTaskId = data.current_task_id;
                                    renderedFrameIndexes.clear();
                                    currentFrameIndex = 0;
                                    document.getElementById('frames_grid').innerHTML = '';
                                    document.getElementById('timeline_segments').innerHTML = '';
                                    document.getElementById('preview_img').src = '';
                                    document.getElementById('progress_bar').style.width = '0%';
                                }
                                processTaskDataUpdate(taskPayload);
                            }
                            
                            // 检查批处理是否全部完成
                            const allDone = data.task_list.every(t => ['completed', 'stopped', 'error', 'cancelled'].includes(t.status));
                            if (allDone) {
                                clearInterval(statusInterval);
                                document.getElementById('progress_section').classList.remove('active');
                                showToast('批量下载队列已全部完成！');
                                resetButtonStates();
                            } else {
                                document.getElementById('progress_section').classList.add('active');
                            }
                        } else {
                            clearInterval(statusInterval);
                            showToast(data.error || '获取批量状态失败', 'error');
                            resetUI();
                        }
                    } 
                    // 2. 否则处理纯单个任务模式
                    else if (currentTaskId) {
                        const response = await fetch(`/api/status/${currentTaskId}`);
                        const data = await response.json();

                        if (data.success) {
                            processTaskDataUpdate(data);

                            if (['completed', 'error', 'cancelled', 'stopped'].includes(data.status)) {
                                clearInterval(statusInterval);
                                document.getElementById('progress_section').classList.remove('active');
                                showToast(data.status === 'completed' ? '处理完成！' : `已中断/终止，成功提取 ${data.frames.length} 帧`);
                                resetButtonStates();
                            }
                        } else {
                            clearInterval(statusInterval);
                            showToast(data.error || '获取单任务状态失败', 'error');
                            resetUI();
                        }
                    }
                } catch (error) {
                    console.error('Polling error:', error);
                }
            }, 1000);
        }

        function insertSorted(container, newElement, index) {
            const children = Array.from(container.children);
            const nextNode = children.find(child => parseInt(child.dataset.index) > index);
            if (nextNode) {
                container.insertBefore(newElement, nextNode);
            } else {
                container.appendChild(newElement);
            }
        }

        function insertNewFrames(newFrames, totalDuration) {
            const framesGrid = document.getElementById('frames_grid');
            const timelineSegments = document.getElementById('timeline_segments');

            newFrames.forEach(frame => {
                const item = document.createElement('div');
                item.className = 'frame-item' + (frame.index === currentFrameIndex ? ' active' : '');
                item.dataset.index = frame.index;
                item.innerHTML = `
                    <img src="/api/frame/${currentTaskId}/${frame.image}" alt="帧 ${frame.index + 1}" loading="lazy">
                    <div class="frame-time">${formatTimeFull(frame.time)}</div>
                `;
                item.addEventListener('click', () => {
                    updatePreview(frame.index);
                });
                insertSorted(framesGrid, item, frame.index);

                const div = document.createElement('div');
                div.className = 'timeline-segment loaded';
                div.style.left = (frame.time / totalDuration * 100) + '%';
                div.style.width = (frame.duration / totalDuration * 100) + '%';
                div.dataset.index = frame.index;
                div.dataset.time = frame.time;
                div.dataset.duration = frame.duration;
                div.dataset.image = frame.image;
                insertSorted(timelineSegments, div, frame.index);
            });
        }

        function updateCompletionBadge(data) {
            const badge = document.getElementById('video_completion_badge');
            const btnResume = document.getElementById('btn_resume');
            
            badge.style.display = 'inline-block';

            if (data.total_segments > 0 && data.frames && data.frames.length >= data.total_segments) {
                badge.textContent = '✅ 全部完成';
                badge.className = 'badge completed';
                btnResume.style.display = 'none';
            } else if (data.total_segments > 0) {
                let failedText = '';
                if (data.failed_segments && data.failed_segments.length > 0) {
                    const displayFailed = data.failed_segments.slice(0, 10).map(i => i + 1).join(', ');
                    const moreStr = data.failed_segments.length > 10 ? '...' : '';
                    failedText = ` | 失败缺失: ${displayFailed}${moreStr}`;
                }

                badge.textContent = `⚠️ 已中断 (进度扫至第 ${data.current} / ${data.total_segments} 帧${failedText})`;
                badge.className = 'badge interrupted';
                
                if (['stopped', 'error', 'cancelled', 'completed'].includes(data.status)) {
                    btnResume.style.display = 'inline-block';
                } else {
                    btnResume.style.display = 'none';
                }
            } else {
                badge.style.display = 'none';
                btnResume.style.display = 'none';
            }
        }

        function updateVideoInfoText(data) {
            const elapsedStr = data.elapsed_time ? `，耗时 ${formatTime(data.elapsed_time)}` : '';
            const acquisitionStr = data.acquisition_time ? `，获取时间: ${data.acquisition_time}` : '';
            
            // 1. 计算存储压缩比 (切片原始大小 / 图片总大小)
            let storageRatioStr = '1/-';
            if (data.total_original_size > 0 && data.total_image_size > 0) {
                const storageDenominator = Math.round(data.total_original_size / data.total_image_size);
                storageRatioStr = `1/${storageDenominator}`;
            }

            // 2. 计算流量压缩比 (切片原始大小 / 截断下载总消耗)
            let trafficRatioStr = '1/-';
            if (data.total_original_size > 0 && data.total_traffic > 0) {
                const trafficDenominator = Math.round(data.total_original_size / data.total_traffic);
                trafficRatioStr = `1/${trafficDenominator}`;
            }

            const videoInfoDiv = document.getElementById('video_info');
            
            // 强制左对齐，并使用 innerHTML 进行多行排版
            videoInfoDiv.style.textAlign = 'left';
            videoInfoDiv.innerHTML = 
                `提取 ${data.frames.length}/${data.total_segments} 切片，切片原始大小：${formatBytes(data.total_original_size)}${acquisitionStr}${elapsedStr}<br>` +
                `切片截断下载大小：${formatBytes(data.total_traffic)}，流量压缩比：${trafficRatioStr}<br>` +
                `图片总大小 ${formatBytes(data.total_image_size)}，存储压缩比：${storageRatioStr}`;
                
            // 顺便让下方的“保存路径”也跟着左对齐，保持视觉统一
            const savePathDiv = document.getElementById('save_path_info');
            if (savePathDiv) savePathDiv.style.textAlign = 'left';
        }

        function updateProgress(data) {
            const progressBar = document.getElementById('progress_bar');
            const progressStatus = document.getElementById('progress_status');
            const progressPercent = document.getElementById('progress_percent');
            const sizesInfo = document.getElementById('progress_sizes_info');
            const timeInfo = document.getElementById('progress_time_info');

            let percent = 0;
            if (data.total_segments > 0) {
                percent = Math.round((data.current / data.total_segments) * 100);
            }

            progressBar.style.width = percent + '%';
            progressPercent.textContent = percent + '%';

            const statusMap = {
                'starting': '启动中...',
                'parsing': '解析m3u8...',
                'downloading': `扫描与下载中... (${data.current}/${data.total_segments})`,
                'completed': '处理完成',
                'stopped': '已保存并中断',
                'error': '处理出错',
                'cancelled': '已取消'
            };
            progressStatus.textContent = statusMap[data.status] || data.status;

            if (data.total_original_size !== undefined && (data.total_original_size > 0 || data.total_traffic > 0)) {
                sizesInfo.textContent = `TS总大小: ${formatBytes(data.total_original_size)} | 消耗流量: ${formatBytes(data.total_traffic)}`;
            } else {
                sizesInfo.textContent = '';
            }

            if (data.elapsed_time !== undefined) {
                let timeStr = `已耗时: ${formatTime(data.elapsed_time)}`;
                if (data.status === 'downloading' && data.remaining_time > 0) {
                    timeStr += ` | 预估剩余: ${formatTime(data.remaining_time)} | 预计完成: ${data.completion_time}`;
                }
                timeInfo.textContent = timeStr;
            } else {
                timeInfo.textContent = '';
            }
            
            document.getElementById('btn_cancel').disabled = false;
        }

        function updatePreview(segmentIndex) {
            if (!taskData || !taskData.frames) return;

            const frame = taskData.frames.find(f => f.index === segmentIndex);
            if (!frame) return;

            currentFrameIndex = segmentIndex;
            const previewImg = document.getElementById('preview_img');
            
            if (!previewImg.src.includes(frame.image)) {
                previewImg.src = `/api/frame/${currentTaskId}/${frame.image}`;
                document.getElementById('preview_time').textContent = formatTimeFull(frame.time);
                document.getElementById('preview_frame_info').textContent = `帧 ${segmentIndex + 1} / ${taskData.total_segments}`;
            }

            const grid = document.getElementById('frames_grid');
            Array.from(grid.children).forEach(child => {
                if (parseInt(child.dataset.index) === segmentIndex) {
                    child.classList.add('active');
                } else {
                    child.classList.remove('active');
                }
            });
        }

        function showViewer(data) {
            document.getElementById('progress_section').classList.remove('active');
            document.getElementById('viewer_section').classList.add('active');
            document.getElementById('input_section').style.display = 'none';

            const videoName = data.video_name || document.getElementById('video_name').value.trim() || '未命名视频';
            document.getElementById('viewer_title').textContent = videoName;
            
            updateVideoInfoText(data);
            updateCompletionBadge(data);
            
            if (data.work_dir) {
                document.getElementById('save_path_info').textContent = `数据保存路径: ${data.work_dir}`;
            } else {
                document.getElementById('save_path_info').textContent = '';
            }
            
            document.getElementById('timeline_duration').textContent = formatTimeFull(data.total_duration);

            document.getElementById('frames_grid').innerHTML = '';
            document.getElementById('timeline_segments').innerHTML = '';
            
            initTimelineEvents();
            
            renderedFrameIndexes.clear();
            if (data.frames && data.frames.length > 0) {
                insertNewFrames(data.frames, data.total_duration);
                data.frames.forEach(f => renderedFrameIndexes.add(f.index));
                updatePreview(data.frames[0].index);
            }
            
            resetButtonStates();
        }

        function initTimelineEvents() {
            if (timelineEventAttached) return;
            const wrapper = document.getElementById('timeline_wrapper');
            const cursor = document.getElementById('timeline_cursor');
            const progress = document.getElementById('timeline_progress');

            wrapper.addEventListener('mousemove', (e) => {
                if (!taskData || !taskData.frames || taskData.frames.length === 0) return;
                const totalDuration = taskData.total_duration;
                const segments = taskData.frames;

                const rect = wrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const percent = Math.max(0, Math.min(1, x / rect.width));
                const currentTime = percent * totalDuration;

                cursor.style.display = 'block';
                cursor.style.left = (percent * 100) + '%';
                
                progress.style.width = (percent * 100) + '%';
                
                cursor.setAttribute('data-time', formatTimeFull(currentTime));

                let closestSegmentIndex = 0;
                let minDiff = Infinity;

                segments.forEach(seg => {
                    const segCenter = seg.time + seg.duration / 2;
                    const diff = Math.abs(segCenter - currentTime);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestSegmentIndex = seg.index;
                    }
                });

                updatePreview(closestSegmentIndex);
            });

            wrapper.addEventListener('mouseleave', () => {
                cursor.style.display = 'none';
                
                if (taskData && taskData.frames && currentFrameIndex !== null) {
                    const activeFrame = taskData.frames.find(f => f.index === currentFrameIndex);
                    if (activeFrame) {
                        const totalDuration = taskData.total_duration;
                        const currentTime = activeFrame.time + activeFrame.duration / 2;
                        const percent = currentTime / totalDuration;
                        progress.style.width = (percent * 100) + '%';
                    }
                }
            });
            
            timelineEventAttached = true;
        }

        function resetButtonStates() {
            const btnDown = document.getElementById('btn_download');
            btnDown.disabled = false;
            btnDown.textContent = '开始下载并提取首帧 (单任务)';
            
            const btnLoad = document.getElementById('btn_load_local');
            btnLoad.disabled = false;
            btnLoad.textContent = '直接加载本地数据文件夹';

            const btnSpec = document.getElementById('btn_batch_specific');
            if (btnSpec) btnSpec.disabled = false;
            
            const btnAll = document.getElementById('btn_batch_all');
            if (btnAll) {
                btnAll.disabled = false;
                btnAll.textContent = '⬇️ 下载 "m3u8" 文件夹内【全部】视频';
            }
            
            document.getElementById('input_section').style.display = 'block';
        }

        function resetUI() {
            resetButtonStates();
            document.getElementById('progress_section').classList.remove('active');
            document.getElementById('empty_state').style.display = 'block';
            document.getElementById('viewer_section').classList.remove('active');
            document.getElementById('batch_list_section').style.display = 'none';
            currentTaskId = null;
            currentBatchId = null;
            currentFrameIndex = 0;
            renderedFrameIndexes.clear();
            if (statusInterval) clearInterval(statusInterval);
        }
    </script>
</body>
